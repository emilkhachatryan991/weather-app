<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погода</title>
<style>
  :root {
    --bg: #0f1724;
    --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.14);
    --text: #f4f7fb;
    --muted: #9fb0c7;
    --accent: #5aa9ff;
    --error: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 60%),
                radial-gradient(900px 500px at 90% 110%, #2b1f4a 0%, transparent 60%),
                var(--bg);
  }
  .app { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 18px; letter-spacing: .2px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 13px 15px; font-size: 16px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); }
  button {
    padding: 13px 18px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #07233f;
  }
  button:disabled { opacity: .6; cursor: default; }
  .card {
    margin-top: 18px; padding: 22px;
    border: 1px solid var(--border); border-radius: 18px;
    background: var(--card); backdrop-filter: blur(8px);
  }
  .city { font-size: 19px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .temp { font-size: 52px; font-weight: 700; line-height: 1; }
  .desc { text-transform: capitalize; color: var(--muted); margin-top: 6px; }
  .extra { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  img.icon { width: 82px; height: 82px; }
  .msg { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
  .msg.error { color: var(--error); }
  .hidden { display: none; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <h1>Погода по городу</h1>

  <form id="form" autocomplete="off">
    <input id="city" name="city" placeholder="Например: Ереван" required>
    <button id="btn" type="submit">Найти</button>
  </form>

  <div id="msg" class="msg hidden"></div>

  <div id="card" class="card hidden">
    <div class="city" id="cityName"></div>
    <div class="row">
      <img class="icon" id="icon" alt="">
      <div>
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>
      </div>
    </div>
    <div class="extra">
      <span>Ощущается: <b id="feels"></b></span>
      <span>Влажность: <b id="hum"></b></span>
      <span>Ветер: <b id="wind"></b></span>
    </div>
  </div>

  <footer>Данные: OpenWeather</footer>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('city');
  const btn = document.getElementById('btn');
  const card = document.getElementById('card');
  const msg = document.getElementById('msg');

  function showMessage(text, isError) {
    msg.textContent = text;
    msg.classList.remove('hidden');
    msg.classList.toggle('error', !!isError);
    card.classList.add('hidden');
  }

  function render(data) {
    document.getElementById('cityName').textContent = data.city + (data.country ? ', ' + data.country : '');
    document.getElementById('temp').textContent = Math.round(data.temp) + '°C';
    document.getElementById('desc').textContent = data.description;
    document.getElementById('feels').textContent = Math.round(data.feelsLike) + '°C';
    document.getElementById('hum').textContent = data.humidity + '%';
    document.getElementById('wind').textContent = Math.round(data.wind) + ' м/с';
    const icon = document.getElementById('icon');
    icon.src = 'https://openweathermap.org/img/wn/' + data.icon + '@2x.png';
    icon.alt = data.description;
    msg.classList.add('hidden');
    card.classList.remove('hidden');
  }

  async function loadWeather(city) {
    btn.disabled = true;
    showMessage('Загружаю…', false);
    try {
      const res = await fetch('/api/weather?city=' + encodeURIComponent(city));
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.error || 'Не удалось получить погоду. Попробуйте ещё раз.', true);
        return;
      }
      render(data);
      localStorage.setItem('lastCity', city);
    } catch (e) {
      showMessage('Нет связи с сервером. Проверьте интернет и попробуйте снова.', true);
    } finally {
      btn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const city = input.value.trim();
    if (city) loadWeather(city);
  });

  // при перезагрузке страницы восстанавливаем последний город
  const last = localStorage.getItem('lastCity');
  if (last) { input.value = last; loadWeather(last); }
</script>
</body>
</html>
